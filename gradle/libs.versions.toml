# ─────────────────────────────────────────────────────────────
#  QryptIN — gradle/libs.versions.toml
#  Single source of truth for all dependency versions
# ─────────────────────────────────────────────────────────────

[versions]
agp                     = "8.5.2"          # Android Gradle Plugin (Koala/Iguana/Quail compatible)
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.28"
composeBom              = "2024.09.03"
coreKtx                 = "1.13.1"
activityCompose         = "1.9.2"
lifecycleRuntimeKtx     = "2.8.6"
lifecycleViewmodelCompose = "2.8.6"
lifecycleViewmodelKtx   = "2.8.6"
navigationCompose       = "2.8.3"
coreSplashscreen        = "1.0.1"
coilCompose             = "2.7.0"
googleFonts             = "1.7.1"
room                    = "2.6.1"
datastorePreferences    = "1.1.1"
coroutinesAndroid       = "1.8.1"
firebaseBom             = "33.1.0"

[libraries]
# ── Core ─────────────────────────────────────────────────────
androidx-core-ktx                   = { group = "androidx.core",      name = "core-ktx",              version.ref = "coreKtx" }
androidx-activity-compose           = { group = "androidx.activity",  name = "activity-compose",       version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",  version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-viewmodel-ktx    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
androidx-core-splashscreen          = { group = "androidx.core",      name = "core-splashscreen",      version.ref = "coreSplashscreen" }
firebase-bom        = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth       = { group = "com.google.firebase", name = "firebase-auth-ktx" }
retrofit            = { group = "com.squareup.retrofit2", name = "retrofit", version = "2.9.0" }
retrofit-gson       = { group = "com.squareup.retrofit2", name = "converter-gson", version = "2.9.0" }
okhttp-logging      = { group = "com.squareup.okhttp3", name = "logging-interceptor", version = "4.12.0" }

# ── Persistence: Room + DataStore ─────────────────────────────
androidx-room-runtime        = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx            = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler        = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
kotlinx-coroutines-android    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }

# ── Compose BOM ──────────────────────────────────────────────
androidx-compose-bom         = { group = "androidx.compose", name = "compose-bom",          version.ref = "composeBom" }
androidx-compose-ui          = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling  = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-animation   = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-foundation  = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3           = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Alias used in feature modules (matches existing module imports)
androidx-ui              = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics     = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }

# ── Navigation ───────────────────────────────────────────────
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ── Image loading ────────────────────────────────────────────
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }

# ── Fonts ────────────────────────────────────────────────────
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "googleFonts" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services     = { id = "com.google.gms.google-services", version = "4.4.2" }